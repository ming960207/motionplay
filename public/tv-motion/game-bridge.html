<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionPlay · 游戏控制桥接</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0a1424;color:white;font:16px system-ui}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#152b42}
#game{display:block;width:100%;height:calc(100% - 74px);border:0;background:#0c192b}
#status{color:#9edbd3}code{font-size:13px}button{padding:8px 15px}
</style></head><body>
<header><strong>MotionPlay 游戏桥接</strong><span id="status">连接中…</span><code id="code">—</code><button id="retry">重新配对</button></header>
<iframe id="game" title="MotionPlay 游戏" allow="fullscreen" referrerpolicy="same-origin"></iframe>
<script>
const params=new URLSearchParams(location.search);
const route=params.get('game');
if(!route||!route.startsWith('/')||route.startsWith('//')||route.includes('\\')){
  document.getElementById('status').textContent='缺少合法的游戏路径 ?game=/实际游戏路径';
  throw new Error('Invalid game path');
}
const frame=document.getElementById('game');
frame.src=route;
const relay=params.get('relay')||(location.protocol==='https:'?'wss://'+location.host+'/motion-ws':'ws://'+location.hostname+':8787');
let socket,lastSeq=-1,connected=false,frameReady=false;
frame.addEventListener('load',()=>{frameReady=true});
const map={JUMP:['ArrowUp','Space'],DUCK:['ArrowDown'],LEFT:['ArrowLeft'],RIGHT:['ArrowRight'],NEUTRAL:[]};
function dispatch(action){
  if(!connected||!frameReady)return;
  const keys=map[action];
  if(!keys||keys.length===0)return;
  // Synthetic events only reach listeners in this same-origin frame.
  // Game implementations using trusted keyboard events or internal pose state
  // require an explicit MotionAction adapter in their own input layer.
  let gameWindow,gameDocument;
  try{
    gameWindow=frame.contentWindow;
    gameDocument=gameWindow.document;
  }catch(error){
    document.getElementById('status').textContent='游戏不是同源页面，无法桥接';
    return;
  }
  for(const key of keys){
    const init={key:key==='Space'?' ':key,code:key,bubbles:true,cancelable:true};
    // Dispatch at window: most canvas games listen on window.
    // A second document event supports document-level listeners.
    gameWindow.dispatchEvent(new gameWindow.KeyboardEvent('keydown',init));
    gameDocument.dispatchEvent(new gameWindow.KeyboardEvent('keydown',init));
    gameWindow.dispatchEvent(new gameWindow.KeyboardEvent('keyup',init));
    gameDocument.dispatchEvent(new gameWindow.KeyboardEvent('keyup',init));
  }
}
function connect(){
  if(socket)socket.close();
  connected=false;lastSeq=-1;
  document.getElementById('code').textContent='—';
  socket=new WebSocket(relay);
  socket.onopen=()=>socket.send(JSON.stringify({type:'create'}));
  socket.onmessage=event=>{
    const message=JSON.parse(event.data);
    if(message.type==='created'){document.getElementById('code').textContent=message.code;document.getElementById('status').textContent='等待手机配对'}
    if(message.type==='connected'){connected=true;lastSeq=-1;document.getElementById('status').textContent='手机已连接'}
    if(message.type==='disconnected'){connected=false;lastSeq=-1;document.getElementById('status').textContent='手机已断开，控制暂停'}
    if(message.type==='motion'&&connected&&Number.isSafeInteger(message.sequence)&&message.sequence>lastSeq){
      lastSeq=message.sequence;
      dispatch(message.action);
    }
    if(message.type==='error')document.getElementById('status').textContent=message.message;
  };
  socket.onclose=()=>{connected=false;document.getElementById('status').textContent='连接中断'};
}
document.getElementById('retry').onclick=connect;
connect();
</script></body></html>
