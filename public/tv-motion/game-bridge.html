<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionPlay · 游戏控制桥接</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0a1424;color:white;font:16px system-ui}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#152b42}
#game{display:block;width:100%;height:calc(100% - 74px);border:0;background:#0c192b}
#status{color:#9edbd3}code{font-size:13px}button{padding:8px 15px}
</style></head><body>
<header><strong>MotionPlay 游戏桥接</strong><span id="status">连接中…</span><code id="code">—</code><button id="retry">重新配对</button></header>
<iframe id="game" title="MotionPlay 游戏" allow="fullscreen" referrerpolicy="same-origin"></iframe>
<script>
const params=new URLSearchParams(location.search);
const route=params.get('game');
if(!route||!route.startsWith('/')||route.startsWith('//')||route.includes('\\')){
  document.getElementById('status').textContent='缺少合法的游戏路径 ?game=/实际游戏路径';
  throw new Error('Invalid game path');
}
const frame=document.getElementById('game');
frame.src=route;
const relay=params.get('relay')||(location.protocol==='https:'?'wss://'+location.host+'/motion-ws':'ws://'+location.hostname+':8787');
let socket,lastSeq=-1;
const map={JUMP:['ArrowUp','Space'],DUCK:['ArrowDown'],LEFT:['ArrowLeft'],RIGHT:['ArrowRight'],NEUTRAL:[]};
function dispatch(action){
  const keys=map[action];
  if(!keys)return;
  // Same-origin only: cross-origin frames must use a vetted postMessage adapter.
  let target;
  try{target=frame.contentWindow?.document}catch{return}
  if(!target)return;
  for(const key of keys){
    const code=key==='Space'?'Space':key;
    target.dispatchEvent(new KeyboardEvent('keydown',{key:key==='Space'?' ':key,code,bubbles:true}));
    target.dispatchEvent(new KeyboardEvent('keyup',{key:key==='Space'?' ':key,code,bubbles:true}));
  }
}
function connect(){
  if(socket)socket.close();
  socket=new WebSocket(relay);
  socket.onopen=()=>socket.send(JSON.stringify({type:'create'}));
  socket.onmessage=event=>{
    const message=JSON.parse(event.data);
    if(message.type==='created'){document.getElementById('code').textContent=message.code;document.getElementById('status').textContent='等待手机配对'}
    if(message.type==='connected')document.getElementById('status').textContent='手机已连接';
    if(message.type==='disconnected')document.getElementById('status').textContent='手机已断开，控制暂停';
    if(message.type==='motion'&&Number.isSafeInteger(message.sequence)&&message.sequence>lastSeq){
      lastSeq=message.sequence;
      dispatch(message.action);
    }
    if(message.type==='error')document.getElementById('status').textContent=message.message;
  };
  socket.onclose=()=>document.getElementById('status').textContent='连接中断';
}
document.getElementById('retry').onclick=connect;
connect();
</script></body></html>
