<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionPlay · 摄像头控制</title>
<style>
body{margin:0;background:#0b1729;color:#f5f8ff;font:16px system-ui;padding:16px}
main{max-width:650px;margin:auto}input,button,select{font:inherit;padding:12px;border-radius:8px}
input{background:#182e45;color:#fff;border:1px solid #526c82;width:100%;box-sizing:border-box}
select{background:#182e45;color:#fff;border:1px solid #526c82;padding:10px;border-radius:8px;margin:8px 0}button{background:#25618a;color:white;border:0;margin:10px 5px 10px 0}
video{width:100%;max-height:55vh;object-fit:contain;background:#000;transform:scaleX(-1)}
#status{color:#9fe5cf}small{color:#a8b9c9}progress{width:100%;height:12px;accent-color:#55bfa9}
</style>
</head>
<body><main>
<h1>MotionPlay 摄像头体感控制</h1>
<p>手机与电视连接同一网络。需要 HTTPS 摄像头权限；本页在手机本地推理，不上传视频。</p>
<label>电视配对码<input id="code" autocomplete="off" placeholder="电视上显示的配对码"></label>
<label>WebSocket 服务地址<input id="relay" placeholder="wss://your-host.example/ws"></label>
<label>跳跃灵敏度 <select id="sensitivity"><option value="0.28">低（减少误判）</option><option value="0.22" selected>标准</option><option value="0.16">高（轻微起跳）</option></select></label>
<button id="start">连接并开启摄像头</button><button id="calibrate" disabled>重新标定站姿</button><button id="stop" disabled>停止</button>
<p id="status" role="status">未连接</p>
<video id="video" autoplay muted playsinline></video>
<p>动作：<strong id="action">—</strong>　识别状态：<strong id="tracking">未开始</strong></p>
<p>站姿标定：<progress id="calibration-progress" max="45" value="0"></progress></p>
<small>请将全身放入画面，保持站立约 2 秒完成标定。身体整体向上移动触发 JUMP，下蹲触发 DUCK，左右倾斜触发 LEFT/RIGHT。摄像头位置固定，避免移动手机；该算法仍需实机验证。</small>
</main>
<script src="vendor/mediapipe/pose/pose.js"></script>
<script>
const $=id=>document.getElementById(id);
let socket,stream,pose,frame=0,sequence=0,active=false,session=0,poseMissingFrames=0,lastAction='NEUTRAL',lastSent=0,stableAction='NEUTRAL',candidate='NEUTRAL',candidateCount=0,baselineHip=null,baselineTorso=null,calibration=[],lastJumpAt=0,jumpArmed=true,baselineKneeRatio=null;
const status=s=>$('status').textContent=s;
const isVisible=p=>p&&p.visibility>=0.55;
function classify(points){
  const leftShoulder=points[11],rightShoulder=points[12];
  const leftHip=points[23],rightHip=points[24];
  const leftKnee=points[25],rightKnee=points[26];
  if(![leftShoulder,rightShoulder,leftHip,rightHip,leftKnee,rightKnee].every(isVisible))return 'NEUTRAL';
  const shoulderY=(leftShoulder.y+rightShoulder.y)/2;
  const hipY=(leftHip.y+rightHip.y)/2;
  const kneeY=(leftKnee.y+rightKnee.y)/2;
  const torso=Math.max(0.05,hipY-shoulderY);
  const kneeRatio=(kneeY-hipY)/torso;
  const isSquatting=baselineKneeRatio===null?kneeRatio<0.65:kneeRatio<baselineKneeRatio*0.72;
  if(baselineHip===null){
    if(!isSquatting){
      calibration.push({hipY,torso,kneeRatio});$('calibration-progress').value=calibration.length;
      if(calibration.length>=45){
        const hipValues=calibration.map(sample=>sample.hipY);
        if(Math.max(...hipValues)-Math.min(...hipValues)>0.045){
          calibration=[];$('calibration-progress').value=0;status('标定期间身体移动，请保持站直重新标定');return 'NEUTRAL';
        }
        const median=key=>calibration.map(sample=>sample[key]).sort((a,b)=>a-b)[Math.floor(calibration.length/2)];
        baselineHip=median('hipY');baselineTorso=median('torso');baselineKneeRatio=median('kneeRatio');
        status('站姿标定完成，可以开始体感操作');
      }else if(calibration.length%10===0){
        status('标定站姿中：'+calibration.length+'/45 帧');
      }
    }else{calibration=[];$('calibration-progress').value=0}
    return 'NEUTRAL';
  }
  if(isSquatting)return 'DUCK'
  // Compare hip displacement against the calibrated standing position,
  // normalized by torso length to reduce sensitivity to camera distance.
  const now=performance.now();
  const rise=(baselineHip-hipY)/baselineTorso;
  if(rise<0.10)jumpArmed=true;
  if(jumpArmed&&rise>Number($('sensitivity').value)&&now-lastJumpAt>850){
    jumpArmed=false;lastJumpAt=now;
    return 'JUMP';
  }
  const center=(leftShoulder.x+rightShoulder.x)/2;
  const hips=(leftHip.x+rightHip.x)/2;
  if(center-hips>0.12)return 'RIGHT';
  if(hips-center>0.12)return 'LEFT';
  return 'NEUTRAL';
}
function recalibrate(){
  baselineHip=null;baselineTorso=null;baselineKneeRatio=null;calibration=[];lastJumpAt=0;jumpArmed=true;poseMissingFrames=0;$('calibration-progress').value=0;
  stableAction='NEUTRAL';candidate='NEUTRAL';candidateCount=0;lastAction='NEUTRAL';lastSent=0;
  status('请站直并保持身体稳定，正在重新标定');
}
async function onResults(result){
  if(!active)return;
  const points=result.poseLandmarks;
  const visible=points&&[11,12,23,24,25,26].every(index=>isVisible(points[index]));
  poseMissingFrames=visible?0:poseMissingFrames+1;
  const detected=visible?classify(points):'NEUTRAL';
  $('tracking').textContent=!visible?'未识别到完整人体':baselineHip===null?'正在标定':'跟踪正常';
  if(poseMissingFrames>=15&&baselineHip!==null){
    recalibrate();
    status('人体持续丢失，请重新站直等待标定');
  }
  if(detected===candidate)candidateCount++;else{candidate=detected;candidateCount=1}
  if(candidateCount>= (candidate==='JUMP'||candidate==='NEUTRAL'?1:3))stableAction=candidate;
  const action=stableAction;
  $('action').textContent=action;
  const now=Date.now();
  if(socket?.readyState===WebSocket.OPEN&&(action!==lastAction||now-lastSent>1000)){
    socket.send(JSON.stringify({type:'motion',sequence:++sequence,timestamp:now,action,confidence:1}));
    lastAction=action;lastSent=now;
  }
}
async function loop(token){
  if(!active||token!==session)return;
  try{await pose.send({image:$('video')})}catch(error){if(token===session){status('姿态识别失败：'+error.message);stop()}return}
  if(active&&token===session)frame=requestAnimationFrame(()=>loop(token));
}
function stop(){
  session++;
  active=false;cancelAnimationFrame(frame);$('action').textContent='—';$('tracking').textContent='未开始';$('calibration-progress').value=0;stableAction='NEUTRAL';candidate='NEUTRAL';candidateCount=0;lastAction='NEUTRAL';baselineHip=null;baselineTorso=null;baselineKneeRatio=null;calibration=[];jumpArmed=true;poseMissingFrames=0;
  stream?.getTracks().forEach(t=>t.stop());stream=undefined;
  $('video').srcObject=null;
  socket?.close();socket=undefined;
  if(pose){void pose.close();pose=undefined}
  $('start').disabled=false;$('stop').disabled=true;$('calibrate').disabled=true;
}
$('stop').onclick=()=>{stop();status('已停止')};
$('calibrate').onclick=recalibrate;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&active){stop();status('页面已切换到后台，摄像头已停止，请重新连接')}
});
$('start').onclick=async()=>{
  if(!window.isSecureContext){status('摄像头需要 HTTPS 安全上下文');return}
  if(!navigator.mediaDevices?.getUserMedia){status('当前浏览器不支持摄像头访问');return}
  const code=$('code').value.trim(),url=$('relay').value.trim() || (location.protocol==='https:'?'wss://':'ws://')+location.host+'/motion-ws';
  if(!/^[0-9a-f]{32}$/.test(code)){status('请输入电视上的 32 位配对码');return}
  if(!/^wss:\/\//.test(url)&&!/^ws:\/\/localhost(?::\d+)?(?:\/|$)/.test(url)){status('请输入 wss:// 服务地址（localhost 可使用 ws://）');return}
  $('start').disabled=true;
  const token=++session;
  try{
    const acquiredStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    if(token!==session){acquiredStream.getTracks().forEach(track=>track.stop());return}
    stream=acquiredStream;
    $('video').srcObject=stream;await $('video').play();
    if(token!==session)return;
    const PoseCtor=globalThis.Pose;
    if(!PoseCtor)throw new Error('MediaPipe Pose 加载失败');
    pose=new PoseCtor({locateFile:file=>'vendor/mediapipe/pose/'+file});
    pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:0.6,minTrackingConfidence:0.6});
    pose.onResults(onResults);
    socket=new WebSocket(url);
    const connection=socket;
    connection.onopen=()=>{if(token===session)connection.send(JSON.stringify({type:'join',code}))};
    connection.onmessage=e=>{if(token!==session)return;const msg=JSON.parse(e.data);if(msg.type==='joined'){status('已连接，开始识别');active=true;recalibrate();$('stop').disabled=false;$('calibrate').disabled=false;loop(token)}else if(msg.type==='error'){status('连接失败：'+msg.message);stop()}else if(msg.type==='disconnected'){status('电视已断开');stop()}};
    connection.onclose=()=>{if(token===session){status('连接中断');stop()}};
    connection.onerror=()=>{if(token===session){status('WebSocket 连接错误');stop()}};
  }catch(error){if(token===session){status('启动失败：'+error.message);stop()}}
};
</script></body></html>
