<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionPlay TV · Jump Duck</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1525;color:#f4f8ff;font:20px system-ui;overflow:hidden}
header{height:13vh;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}
h1{font-size:clamp(24px,3vw,44px);margin:0}#status{color:#9cc2dd;font-size:17px}
#arena{position:relative;margin:1vh 4vw;height:62vh;background:linear-gradient(#132b47,#1b3854);border:2px solid #45667f;border-radius:18px;overflow:hidden}
#ground{position:absolute;bottom:15%;width:100%;height:4px;background:#8db5ce}
#player{position:absolute;left:17%;bottom:calc(15% + 4px);width:55px;height:90px;background:#8ce4ba;border-radius:12px;transition:height .15s}
#player.duck{height:38px}#obstacle{position:absolute;bottom:calc(15% + 4px);right:-70px;width:38px;height:75px;background:#f0a36b;border-radius:6px}
#obstacle.high{bottom:calc(15% + 85px);height:35px}
#hud{position:absolute;top:20px;left:25px;font-size:24px}
#center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
#message{font-size:clamp(24px,4vw,54px);text-shadow:0 2px 8px #081422}
footer{display:flex;justify-content:space-between;align-items:center;padding:1vh 4vw;font-size:16px}
code{font-size:14px;overflow-wrap:anywhere;color:#9fe6d4}
button{font:inherit;color:#fff;background:#275777;border:1px solid #6d99b5;border-radius:10px;padding:10px 20px}
</style></head><body>
<header><h1>MotionPlay · Jump Duck</h1><div id="status">正在连接…</div></header>
<div id="arena"><div id="hud">得分 <span id="score">0</span>　最佳 <span id="best">0</span></div><div id="ground"></div><div id="player"></div><div id="obstacle"></div><div id="center"><div id="message">等待手机配对</div></div></div>
<footer><div>配对码：<code id="code">—</code><div>手机打开 /tv-motion/phone-camera.html</div></div><button id="start">开始 / 重试（OK）</button></footer>
<script>
const $=id=>document.getElementById(id);
const endpoint=new URLSearchParams(location.search).get('relay')||(location.protocol==='https:'?'wss://'+location.host+'/motion-ws':'ws://'+location.hostname+':8787');
let socket,connected=false,playing=false,remoteMode=false,previousMotion='NEUTRAL',lastMotionAt=0,score=0,best=0,obstacleX=1.1,last=0,jumpUntil=0,duckUntil=0,obstacleHigh=false,passed=false,spawn=0;
function announce(message){$('message').textContent=message}
function connect(){
  if(socket&&socket.readyState<2)socket.close();
  socket=new WebSocket(endpoint);
  socket.onopen=()=>socket.send(JSON.stringify({type:'create'}));
  socket.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='created'){$('code').textContent=m.code;if(!remoteMode){$('status').textContent='等待手机连接';if(!playing)announce('等待手机配对')}}
    else if(m.type==='connected'){connected=true;remoteMode=false;previousMotion='NEUTRAL';playing=false;$('status').textContent='手机已连接';announce('按 OK 开始游戏')}
    else if(m.type==='motion'&&connected){lastMotionAt=performance.now();onMotion(m.action)}
    else if(m.type==='disconnected'){connected=false;previousMotion='NEUTRAL';lastMotionAt=0;if(!remoteMode){playing=false;$('status').textContent='手机已断开';announce('已暂停 · 等待手机重新连接')}}
    else if(m.type==='error'){if(!remoteMode)$('status').textContent=m.message}
  };
  socket.onclose=()=>{connected=false;if(!remoteMode){playing=false;announce('连接中断 · 按 OK 使用遥控器试玩')}$('status').textContent=remoteMode?'遥控器试玩模式':'服务连接断开'};
  socket.onerror=()=>{if(!remoteMode)$('status').textContent='WebSocket 连接失败 · 可按 OK 试玩'};
}
function onMotion(action){
  if(!playing)return;
  const now=performance.now();
  if(action==='JUMP'&&previousMotion!=='JUMP'&&now>=jumpUntil)jumpUntil=now+750;
  if(action==='DUCK'&&now>=jumpUntil)duckUntil=now+1400;
  if(action==='NEUTRAL'||action==='LEFT'||action==='RIGHT')duckUntil=0;
  previousMotion=action;
}
function reset(){
  if(!connected&&!remoteMode){remoteMode=true;$('status').textContent='遥控器试玩模式'}
  jumpUntil=0;duckUntil=0;previousMotion='NEUTRAL';lastMotionAt=connected?performance.now():0;
  score=0;obstacleX=1.1;last=0;spawn=0;passed=false;obstacleHigh=Math.random()<.5;
  $('score').textContent='0';playing=true;announce('');
}
function tick(now){
  requestAnimationFrame(tick);
  const dt=last?Math.min((now-last)/1000,.05):0;last=now;
  if(playing&&connected&&lastMotionAt&&now-lastMotionAt>2200){previousMotion='NEUTRAL';duckUntil=0;lastMotionAt=0;playing=false;announce('动作信号超时 · 按 OK 重新开始')}
  const player=$('player');
  const jumping=now<jumpUntil,ducking=now<duckUntil;
  player.classList.toggle('duck',ducking&&!jumping);
  const jumpOffset=jumping?Math.sin(Math.PI*(1-(jumpUntil-now)/750))*145:0;
  player.style.transform='translateY('+(-Math.max(0,jumpOffset))+'px)';
  if(!playing)return;
  obstacleX-=dt*(.32+Math.min(score,.4*100)/500);
  if(obstacleX<-.08){obstacleX=1.1;obstacleHigh=Math.random()<.5;passed=false}
  const obstacle=$('obstacle');obstacle.classList.toggle('high',obstacleHigh);
  obstacle.style.left=(obstacleX*100)+'%';
  // Compare actual rendered hitboxes instead of fixed percentages: works
  // across TV resolutions and preserves the gap above the ducking player.
  const playerRect=player.getBoundingClientRect();
  const obstacleRect=obstacle.getBoundingClientRect();
  const overlap=playerRect.left<obstacleRect.right&&playerRect.right>obstacleRect.left&&
    playerRect.top<obstacleRect.bottom&&playerRect.bottom>obstacleRect.top;
  if(overlap){playing=false;announce('游戏结束 · 按 OK 重试');return}
  if(!passed&&obstacleRect.right<playerRect.left){
    passed=true;score++;best=Math.max(best,score);
    $('score').textContent=score;$('best').textContent=best;
  }
}
$('start').onclick=reset;
document.addEventListener('keydown',e=>{
  if(['Enter',' ','NumpadEnter'].includes(e.key)){e.preventDefault();reset()}
  if(e.key==='ArrowUp'){e.preventDefault();if(!e.repeat){previousMotion='NEUTRAL';onMotion('JUMP')}}
  if(e.key==='ArrowDown'){e.preventDefault();onMotion('DUCK')}
  if(e.key==='Escape'||e.key==='Backspace'){playing=false;announce('已暂停 · 按 OK 重新开始')}
});
connect();requestAnimationFrame(tick);
</script></body></html>
