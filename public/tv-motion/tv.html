<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MotionPlay TV · Jump Duck</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b1525;color:#f4f8ff;font:clamp(16px,1.55vw,22px) system-ui;overflow:hidden}
    header{height:12vh;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}
    h1{font-size:clamp(26px,3vw,44px);margin:0}
    #status{color:#9cc2dd;font-size:clamp(14px,1.3vw,18px);text-align:right}
    #arena{position:relative;margin:1vh 4vw;height:66vh;background:linear-gradient(#132b47,#1b3854);border:2px solid #45667f;border-radius:18px;overflow:hidden}
    #ground{position:absolute;bottom:15%;width:100%;height:4px;background:#8db5ce}
    #player{position:absolute;left:17%;bottom:calc(15% + 4px);width:clamp(42px,4vw,64px);height:clamp(68px,8vh,90px);background:#8ce4ba;border-radius:12px;transition:height .15s}
    #player.duck{height:38px}
    #obstacle{position:absolute;bottom:calc(15% + 4px);width:38px;height:75px;background:#f0a36b;border-radius:6px}
    #obstacle.high{bottom:calc(15% + 85px);height:35px}
    #hud{position:absolute;top:20px;left:25px;font-size:clamp(19px,2vw,27px)}
    #center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;padding:8vw}
    #message{font-size:clamp(24px,4vw,54px);text-shadow:0 2px 8px #081422}
    footer{height:16vh;display:flex;justify-content:space-between;align-items:center;gap:3vw;padding:1vh 4vw;font-size:clamp(14px,1.25vw,18px)}
    #pairing{color:#b2c9dc;line-height:1.5}
    code{font-size:14px;overflow-wrap:anywhere;color:#9fe6d4}
    button{font:inherit;color:#fff;background:#275777;border:2px solid #6d99b5;border-radius:10px;padding:12px 22px;cursor:pointer}
    button:focus-visible{outline:4px solid #9fe6d4;outline-offset:3px}
    @media(max-width:800px){header{padding:0 3vw}#arena{margin:1vh 3vw}footer{padding:1vh 3vw}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header><h1>MotionPlay · Jump Duck</h1><div id="status" role="status" aria-live="polite">准备就绪</div></header>
  <div id="arena" aria-label="跳跃与下蹲躲避障碍">
    <div id="hud">得分 <span id="score">0</span>　最佳 <span id="best">0</span></div>
    <div id="ground"></div><div id="player"></div><div id="obstacle"></div>
    <div id="center"><div id="message">按 OK 开始</div></div>
  </div>
  <footer>
    <div id="pairing">本机遥控器：↑ 跳跃　↓ 下蹲　OK 开始 / 暂停<br><span id="phone-help">可选：连接手机摄像头进行体感操作</span><br>配对码：<code id="code">—</code></div>
    <button id="start" type="button">开始游戏（OK）</button>
  </footer>
<script>
const $=id=>document.getElementById(id);
const relay=new URLSearchParams(location.search).get('relay');
const canConnect=Boolean(relay)||location.protocol==='http:'||location.protocol==='https:';
const endpoint=relay||(location.protocol==='https:'?'wss://'+location.host+'/motion-ws':'ws://'+location.hostname+':8787');
let socket,connected=false,playing=false,paused=false,ended=false,remoteMode=false,previousMotion='NEUTRAL',lastMotionAt=0,score=0,best=0,obstacleX=1.1,last=0,jumpUntil=0,duckUntil=0,obstacleHigh=false,passed=false;
try{best=Number(localStorage.getItem('motionplay-jumpduck-best'))||0}catch{}
$('best').textContent=String(best);
function announce(message){$('message').textContent=message}
function updateButton(){
  $('start').textContent=playing?'暂停游戏（OK）':paused?'继续游戏（OK）':ended?'再玩一次（OK）':'开始游戏（OK）';
}
function connect(){
  if(!canConnect){$('status').textContent='离线模式 · 遥控器可玩';$('phone-help').textContent='手机体感需连接 HTTPS 页面与 WSS 服务';return}
  try{socket=new WebSocket(endpoint)}catch{$('status').textContent='服务地址无效 · 遥控器可玩';return}
  socket.onopen=()=>socket.send(JSON.stringify({type:'create'}));
  socket.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='created'){$('code').textContent=m.code;if(!connected)$('status').textContent='等待手机连接 · 遥控器可玩'}
    else if(m.type==='connected'){connected=true;remoteMode=false;previousMotion='NEUTRAL';paused=playing;playing=false;$('status').textContent='手机已连接';announce('按 OK 开始游戏');updateButton()}
    else if(m.type==='motion'&&connected){lastMotionAt=performance.now();onMotion(m.action)}
    else if(m.type==='disconnected'){connected=false;previousMotion='NEUTRAL';lastMotionAt=0;if(playing){playing=false;paused=true;announce('手机已断开 · 游戏已暂停')}$('status').textContent='手机已断开 · 遥控器可继续';updateButton()}
    else if(m.type==='error')$('status').textContent=m.message+' · 遥控器可玩';
  };
  socket.onclose=()=>{connected=false;if(!remoteMode){if(playing){playing=false;paused=true}announce('服务未连接 · 按 OK 使用遥控器');$('status').textContent='离线遥控器模式';updateButton()}};
  socket.onerror=()=>{$('status').textContent='手机服务不可用 · 遥控器可玩'};
}
function onMotion(action){
  if(!playing)return;
  const now=performance.now();
  if(action==='JUMP'&&previousMotion!=='JUMP'&&now>=jumpUntil)jumpUntil=now+750;
  if(action==='DUCK'&&now>=jumpUntil)duckUntil=now+1400;
  if(action==='NEUTRAL'||action==='LEFT'||action==='RIGHT')duckUntil=0;
  previousMotion=action;
}
function startGame(){
  if(!connected&&!canConnect){remoteMode=true;$('status').textContent='离线遥控器模式'}
  jumpUntil=0;duckUntil=0;previousMotion='NEUTRAL';lastMotionAt=connected?performance.now():0;
  score=0;ended=false;obstacleX=1.1;last=0;passed=false;obstacleHigh=Math.random()<.5;
  $('score').textContent='0';playing=true;paused=false;announce('');updateButton();
}
function toggleGame(){
  if(playing){playing=false;paused=true;announce('已暂停 · 按 OK 继续');updateButton();return}
  if(paused){playing=true;paused=false;last=0;announce('');updateButton();return}
  startGame();
}
function tick(now){
  requestAnimationFrame(tick);
  const dt=last?Math.min((now-last)/1000,.05):0;last=now;
  if(playing&&connected&&lastMotionAt&&now-lastMotionAt>2200){previousMotion='NEUTRAL';duckUntil=0;lastMotionAt=0;playing=false;paused=true;announce('动作信号超时 · 游戏已暂停');updateButton()}
  const player=$('player');
  const jumping=now<jumpUntil,ducking=now<duckUntil;
  player.classList.toggle('duck',ducking&&!jumping);
  const jumpOffset=jumping?Math.sin(Math.PI*(1-(jumpUntil-now)/750))*145:0;
  player.style.transform='translateY('+(-Math.max(0,jumpOffset))+'px)';
  if(!playing)return;
  obstacleX-=dt*(.28+Math.min(score,20)*.009);
  if(obstacleX<-.08){obstacleX=1.1;obstacleHigh=Math.random()<.5;passed=false}
  const obstacle=$('obstacle');obstacle.classList.toggle('high',obstacleHigh);
  obstacle.style.left=(obstacleX*100)+'%';
  const playerRect=player.getBoundingClientRect(),obstacleRect=obstacle.getBoundingClientRect();
  const overlap=playerRect.left<obstacleRect.right&&playerRect.right>obstacleRect.left&&playerRect.top<obstacleRect.bottom&&playerRect.bottom>obstacleRect.top;
  if(overlap){playing=false;paused=false;ended=true;announce('游戏结束 · 按 OK 再玩一次');updateButton();return}
  if(!passed&&obstacleRect.right<playerRect.left){
    passed=true;score++;best=Math.max(best,score);
    $('score').textContent=String(score);$('best').textContent=String(best);
    try{localStorage.setItem('motionplay-jumpduck-best',String(best))}catch{}
  }
}
$('start').addEventListener('click',toggleGame);
document.addEventListener('keyup',e=>{if(e.key==='ArrowDown'&&!connected){duckUntil=0;previousMotion='NEUTRAL'}});
document.addEventListener('keydown',e=>{
  if(['Enter',' ','NumpadEnter'].includes(e.key)){e.preventDefault();e.stopPropagation();if(!e.repeat)toggleGame()}
  if(e.key==='ArrowUp'&&playing){e.preventDefault();if(!e.repeat){previousMotion='NEUTRAL';onMotion('JUMP')}}
  if(e.key==='ArrowDown'&&playing){e.preventDefault();onMotion('DUCK')}
  if(e.key==='Escape'||e.key==='Backspace'){if(playing){e.preventDefault();playing=false;paused=true;announce('已暂停 · 按 OK 继续');updateButton()}}
});
connect();requestAnimationFrame(tick);
</script>
</body>
</html>
