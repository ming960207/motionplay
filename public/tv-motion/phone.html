<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionPlay Phone</title><style>body{background:#0c1729;color:#fff;font:18px system-ui;padding:24px}input,button{padding:14px;margin:7px 0;font-size:18px}button{min-width:42%;background:#244d70;color:white;border:1px solid #719bbd;border-radius:9px}input{width:95%;box-sizing:border-box}#status{color:#9fe2cf}</style><h1>MotionPlay 手机控制</h1><p>第一阶段：手动动作联调，尚未接入摄像头</p><input id="code" placeholder="输入电视配对码"><button id="connect">连接电视</button><p id="status">未连接</p><section id="controls" hidden><button data-action="JUMP">跳跃</button><button data-action="DUCK">下蹲</button><button data-action="LEFT">左移</button><button data-action="RIGHT">右移</button><button data-action="NEUTRAL">复位</button></section><script>
let ws,sequence=0;const status=document.querySelector('#status'),controls=document.querySelector('#controls');
document.querySelector('#connect').onclick=()=>{if(ws)ws.close();const endpoint=new URLSearchParams(location.search).get('relay')||'ws://'+location.hostname+':8787';ws=new WebSocket(endpoint);ws.onopen=()=>ws.send(JSON.stringify({type:'join',code:document.querySelector('#code').value.trim()}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){status.textContent='已连接';controls.hidden=false}else if(m.type==='error')status.textContent=m.message;else if(m.type==='disconnected'){status.textContent='电视已断开';controls.hidden=true}};ws.onclose=()=>{status.textContent='连接断开';controls.hidden=true}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'motion',sequence:++sequence,timestamp:Date.now(),action:b.dataset.action,confidence:1}))});
</script></html>
