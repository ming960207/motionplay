name: Android TV Motion APK
on:
  push:
    branches: [feature/android-tv-motion]
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv-motion.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MotionPlay-TV-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
